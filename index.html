<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AVP HRIS</title>
<meta name="description" content="Attendance, leave, approvals, payslips and people for AVP Structural Consultants.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/icons/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AVP HRIS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="AVP HRIS">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f3f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131111" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Caveat:wght@500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Caveat:wght@500;600&display=swap"></noscript>
<script>
  /* Theme + density before first paint — no white flash for dark-mode users. */
  (function () {
    try {
      var t = localStorage.getItem('hris_theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      var d = localStorage.getItem('hris_density');
      if (d) document.documentElement.setAttribute('data-density', d);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="styles/app.css?v=3.1.1">
</head>
<body>
<div class="netbar" role="status">You are offline — changes cannot be saved right now.</div>
<div class="progress-top" id="progress" aria-hidden="true"></div>

<div class="boot-splash" id="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-logo"><img src="assets/logo-full.webp" alt="AVP Structural Consultants" width="190" height="76"></div>
    <div class="splash-word"><span style="animation-delay:.05s">A</span><span style="animation-delay:.1s">V</span><span style="animation-delay:.15s">P</span><span style="animation-delay:.2s">&nbsp;</span><span style="animation-delay:.25s">H</span><span style="animation-delay:.3s">R</span><span style="animation-delay:.35s">I</span><span style="animation-delay:.4s">S</span></div>
    <div class="splash-sub">AVP Structural Consultants</div>
    <div class="splash-bar"><i></i></div>
  </div>
</div>

<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="config.js?v=3.1.1"></script>

<script defer src="js/icons.js?v=3.1.1"></script>
<script defer src="js/runtime.js?v=3.1.1"></script>
<script defer src="js/app.js?v=3.1.1"></script>
<script defer src="js/enhance.js?v=3.1.1"></script>
<script>document.addEventListener('DOMContentLoaded', function () { HRIS.start(); });</script>
</body>
</html>
